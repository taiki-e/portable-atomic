[package]
name = "bench"
version = "0.0.0"
edition = "2018"
rust-version = "1.34" # Prevent clippy from suggesting a code that requires a new version to build.rs.
publish = false

[features]
default = ["fallback", "std"]
fallback = []
std = []

[dev-dependencies]
assert-sys = "0.1"
build-context = "0.1"
criterion = { default-features = false, git = "https://github.com/taiki-e/criterion.rs.git", rev = "18cc8b6f211b266564e6d5311ef1defa0677a815" } # reduce deps
crossbeam-utils = "0.8"
fastrand = "2"
paste = "1"
quickcheck = { version = "1", default-features = false, git = "https://github.com/taiki-e/quickcheck.git", rev = "83b1d5955557fc9dacc52d4a78098d8e6d7eda3b" } # https://github.com/BurntSushi/quickcheck/pull/304 + https://github.com/BurntSushi/quickcheck/pull/282 + https://github.com/BurntSushi/quickcheck/pull/296 + f16/f128 support + lower MSRV
taiki-e-test-helper = { version = "0.1", features = ["critical-section-std", "serde", "valgrind"] }

# Disable benchmarks for third-party implementation by default.
# atomic = "0.6"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "bench"
path = "bench.rs"
harness = false

[lints]
workspace = true
